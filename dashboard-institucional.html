<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaderK 360 | Background Institucional</title>

  <style>
    :root {
      --navy-950: #020611;
      --navy-900: #040914;
      --navy-800: #07111f;
      --gold: #d6b45a;
      --gold-soft: #f1d27a;
      --blue-glow: #1d4ed8;
      --green: #55d6a5;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #020611;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
      color: var(--white);
    }

    .institutional-bg {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(214,180,90,.14), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(29,78,216,.14), transparent 32%),
        radial-gradient(circle at bottom right, rgba(85,214,165,.08), transparent 34%),
        linear-gradient(180deg, #020611 0%, #040914 45%, #020611 100%);
    }

    .institutional-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: .24;
      mask-image: radial-gradient(circle at center, black 0%, transparent 75%);
    }

    .institutional-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(214,180,90,.05) 45%,
          rgba(214,180,90,.11) 50%,
          rgba(214,180,90,.05) 55%,
          transparent 100%
        );
      transform: translateX(-120%);
      animation: executiveSweep 14s linear infinite;
    }

    @keyframes executiveSweep {
      to {
        transform: translateX(120%);
      }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(42px);
      opacity: .38;
      animation: orbFloat 16s ease-in-out infinite;
    }

    .orb-gold {
      width: 360px;
      height: 360px;
      left: -120px;
      top: 8%;
      background: rgba(214,180,90,.28);
    }

    .orb-blue {
      width: 420px;
      height: 420px;
      right: -160px;
      top: 18%;
      background: rgba(29,78,216,.24);
      animation-delay: 3s;
    }

    .orb-green {
      width: 280px;
      height: 280px;
      right: 18%;
      bottom: -120px;
      background: rgba(85,214,165,.16);
      animation-delay: 6s;
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-28px) scale(1.06);
      }
    }

    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particles span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(214,180,90,.48);
      box-shadow: 0 0 12px rgba(214,180,90,.55);
      animation: particleRise linear infinite;
    }

    @keyframes particleRise {
      0% {
        transform: translateY(0);
        opacity: 0;
      }

      20% {
        opacity: .8;
      }

      100% {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    .executive-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background:
        linear-gradient(115deg, transparent 0%, transparent 42%, rgba(214,180,90,.28) 42.4%, transparent 43%),
        linear-gradient(65deg, transparent 0%, transparent 62%, rgba(29,78,216,.22) 62.4%, transparent 63%);
      background-size: 620px 620px;
      animation: lineDrift 30s linear infinite;
    }

    @keyframes lineDrift {
      from {
        background-position: 0 0, 0 0;
      }

      to {
        background-position: 620px -620px, -620px 620px;
      }
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 0%, rgba(0,0,0,.22) 62%, rgba(0,0,0,.72) 100%);
    }

    .noise {
      position: absolute;
      inset: 0;
      opacity: .045;
      pointer-events: none;
      background-image:
        repeating-radial-gradient(circle at 0 0, rgba(255,255,255,.18) 0, rgba(255,255,255,.18) 1px, transparent 1px, transparent 4px);
      mix-blend-mode: overlay;
    }

    .demo-content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 60px 24px;
      text-align: center;
    }

    .demo-card {
      max-width: 900px;
      padding: 48px;
      border-radius: 34px;
      background: rgba(7,17,31,.62);
      border: 1px solid rgba(214,180,90,.22);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 90px rgba(0,0,0,.42);
    }

    .demo-card span {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--gold-soft);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .demo-card h1 {
      font-size: clamp(42px, 6vw, 78px);
      line-height: 1;
      letter-spacing: -2.8px;
      margin-bottom: 22px;
    }

    .demo-card p {
      color: rgba(255,255,255,.72);
      font-size: 18px;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      .demo-card {
        padding: 32px;
      }
    }
  </style>
</head>

<body>
  <div class="institutional-bg">
    <div class="orb orb-gold"></div>
    <div class="orb orb-blue"></div>
    <div class="orb orb-green"></div>
    <div class="executive-lines"></div>
    <div class="particles" id="particles"></div>
    <div class="noise"></div>
    <div class="vignette"></div>
  </div>

  <main class="demo-content">
    <section class="demo-card">
      <span>LeaderK Executive Intelligence Center</span>
      <h1>Background Institucional Premium</h1>
      <p>
        Fundo visual com profundidade, partículas executivas, brilho institucional,
        linhas de inteligência e atmosfera corporativa internacional.
      </p>
    </section>
  </main>

  <script>
    const particles = document.getElementById('particles')

    for (let i = 0; i < 70; i++) {
      const particle = document.createElement('span')

      particle.style.left = Math.random() * 100 + 'vw'
      particle.style.top = Math.random() * 100 + 'vh'
      particle.style.animationDuration = (14 + Math.random() * 24) + 's'
      particle.style.animationDelay = Math.random() * 10 + 's'
      particle.style.opacity = Math.random() * .8

      particles.appendChild(particle)
    }
  </script>
</body>
</html>
